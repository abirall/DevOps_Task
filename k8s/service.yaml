
apiVersion: v1
kind: Service
metadata:
  name: python-app-service
  namespace: python-app
  labels:
    app: python-app

spec:
  type: ClusterIP

  selector:
    app: python-app

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

