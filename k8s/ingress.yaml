
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: python-app-ingress
  namespace: python-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  ingressClassName: nginx

  rules:
    - host: python-app.example.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: python-app-service
                port:
                  number: 80
